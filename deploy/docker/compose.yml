services:
  brain:
    build:
      context: ../..
      dockerfile: deploy/docker/brain.Dockerfile
    env_file:
      - ../../brain/.env
    environment:
      NODE_ENV: production
      BRAIN_HOST: 0.0.0.0
      BRAIN_PORT: 3400
      BRAIN_MEMORY_DB: /var/lib/sdk-bot/memory.db
    volumes:
      - sdk_bot_state:/var/lib/sdk-bot
      - sdk_bot_brain_logs:/app/brain/logs
      - ../../brain/profiles:/app/brain/profiles
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:3400/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 🎤 STT local (faster-whisper). Expone /v1/audio/transcriptions en la red
  # Docker interna (stt:9000). NO se publica en el host: el gateway es el único
  # cliente y corre en la misma red. El modelo se cachea en el volumen
  # sdk_bot_stt_models para no re-descargarlo en cada reinicio.
  stt:
    build:
      context: ../..
      dockerfile: deploy/docker/stt.Dockerfile
    environment:
      NODE_ENV: production
      STT_MODEL: base            # base | small (small = mejor accuracy, más CPU)
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      STT_CACHE: /var/lib/sdk-bot-stt/models
      STT_PORT: 9000
      STT_LANGUAGE: es           # forzar español acelera y mejora accuracy
      STT_MAX_UPLOAD_BYTES: 5242880
    volumes:
      - sdk_bot_stt_models:/var/lib/sdk-bot-stt/models
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      NODE_ENV: production
      BRAIN_API_BASE: http://brain:3400
      SDK_PANEL_GATEWAY_SECRET: ${SDK_PANEL_GATEWAY_SECRET:?Define SDK_PANEL_GATEWAY_SECRET para gateway y panel}
      INTERNAL_BUS_HOST: 0.0.0.0
      INTERNAL_BUS_PORT: 3240
      STATUS_HOST: 127.0.0.1
      STATUS_PORT: 3640
      SDK_ADMIN_WEB_ENABLED: 0
      SDK_AUTH_DIR: /var/lib/sdk-bot/auth_info_baileys
      SDK_CONTACTS_DB_PATH: /var/lib/sdk-bot/contacts_db.json
      SDK_CONVERSATIONS_DB_PATH: /var/lib/sdk-bot/conversations.db
      SDK_SETTINGS_DB_PATH: /var/lib/sdk-bot/settings_db.json
      SDK_BROADCAST_DB_PATH: /var/lib/sdk-bot/broadcast_db.json
      SDK_MESSAGE_QUEUE_PATH: /var/lib/sdk-bot/queue/pending_messages.jsonl
      SDK_GATEWAY_LOCK_PATH: /var/lib/sdk-bot/.gateway.lock
      BRAIN_MEMORY_DB: /var/lib/sdk-bot/memory.db
      SDK_ADMIN_WEB_LOG_GATEWAY: /app/gateway/logs
      SDK_ADMIN_WEB_LOG_BRAIN: /app/brain/logs
    volumes:
      - sdk_bot_state:/var/lib/sdk-bot
      - sdk_bot_gateway_logs:/app/gateway/logs
      - sdk_bot_brain_logs:/app/brain/logs
      - ../../brain/.env:/app/brain/.env:ro
    depends_on:
      brain:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3640/health')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  panel:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    # El panel es un proceso DISTINTO del gateway: debe correr panel/index.js
    # (solo proxifica el bus interno en :5400), NO index.js (que conecta WhatsApp
    # y generaria un segundo gateway del mismo numero -> conflicto de sesion).
    command: ["node", "panel/index.js"]
    env_file:
      - ../../gateway/panel/.env
    environment:
      NODE_ENV: production
      ADMIN_WEB_PORT: 3005
      ADMIN_WEB_HOST: 0.0.0.0
      GATEWAY_INTERNAL_URL: http://gateway:3240
      SDK_PANEL_GATEWAY_SECRET: ${SDK_PANEL_GATEWAY_SECRET:?Define SDK_PANEL_GATEWAY_SECRET para gateway y panel}
    volumes:
      - sdk_bot_gateway_logs:/app/gateway/logs
      - sdk_bot_brain_logs:/app/brain/logs
    depends_on:
      gateway:
        condition: service_healthy
    # El panel se expone SOLO via Caddy (bot.zer0x.org) en la red proxy_net;
    # no se publica el puerto en el host. Caddy hace reverse_proxy sdk-bot-panel:3005.
    networks:
      default:
      proxy_net:
        aliases:
          - sdk-bot-panel
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3005/')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  default:
  # Red externa del proxy Caddy (infra-core). Permite que Caddy enrute
  # bot.zer0x.org -> sdk-bot-panel:3005 sin exponer puertos en el host.
  proxy_net:
    external: true
    name: proxy_net

volumes:
  sdk_bot_state:
    name: sdk-bot-production-state
  sdk_bot_gateway_logs:
    name: sdk-bot-production-gateway-logs
  sdk_bot_brain_logs:
    name: sdk-bot-production-brain-logs
  sdk_bot_stt_models:
    name: sdk-bot-production-stt-models
