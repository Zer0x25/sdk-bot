name: Deploy to Homelab

# Solo despues de que el CI (tests brain/gateway) pase exitosamente en main.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    name: Deploy to VM (Self-Hosted)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: self-hosted
    steps:
      - name: Deploy locally
        run: |
          cd /home/zrx1/server.lab/repos/sdk-bot
          git pull origin main
          # --force-recreate: el self-runner NO recrea contenedores ya
          # existentes y estables con `up -d --build`, dejando correr la
          # imagen vieja tras un fix. Forzar recreación hace el deploy
          # idempotente y autónomo (sin intervención manual en la VM).
          docker compose -f deploy/docker/compose.yml up -d --build --force-recreate
          docker image prune -f

      - name: Post-Deploy Health Check
        run: |
          echo "🩺 Health check de los 3 contenedores..."
          sleep 10
          for c in docker-brain-1 docker-gateway-1 docker-panel-1; do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$c" 2>/dev/null || echo "not_found")
            if [ "$STATUS" != "healthy" ]; then
              echo "❌ $c no healthy (status: $STATUS)"
              docker logs --tail 40 "$c" 2>/dev/null || true
              exit 1
            fi
            echo "🟢 $c healthy"
          done

          # El panel debe responder en su puerto interno (proxy Caddy -> bot.zer0x.org)
          docker exec docker-panel-1 node -e "fetch('http://127.0.0.1:3005/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
            && echo "🟢 panel responde en :3005" \
            || { echo "❌ panel no responde"; exit 1; }

          echo "🎉 Deploy de SDK-Bot OK (bot.zer0x.org)."
