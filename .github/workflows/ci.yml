name: CI

on:
  pull_request:
    branches: [main]
    # Release Please only changes generated release notes/version metadata.
    # Those PRs are checked through workflow_dispatch from release-please.yml.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (schema + generated types + tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check

  gateway:
    name: Gateway (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.22.2', '24']
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            apps/gateway/package-lock.json
            apps/panel/package-lock.json
      - run: npm ci
      - run: npm --prefix ../panel ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run panel:check
      - run: npm run spike:sqlite
      - run: npm test
      - run: SDK_BOT_DEV_SMOKE_INBOX=1 PANEL_CONVERSATIONS_UI_ENABLED=true bash ../../deploy/linux/tests/dev-smoke.sh

  brain:
    name: Brain (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/brain/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest tests/ -q
